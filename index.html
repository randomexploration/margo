<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400;1,600&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:           #FAF0F4;
      --pink-soft:    #F4C8D8;
      --pink-accent:  #DFA0BC;
      --blue-soft:    #C2D8EE;
      --blue-accent:  #B890A4;
      --text-dark:    #B890A4;
      --text-mid:     #9080A4;
      --fade-pink:    rgba(244, 200, 216, 0.35);
      --fade-blue:    rgba(194, 216, 238, 0.40);
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 70% 60% at 0% 0%,   rgba(244, 200, 216, 0.45) 0%, transparent 70%),
        radial-gradient(ellipse 65% 55% at 100% 100%, rgba(194, 216, 238, 0.50) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 70% 40%,  rgba(138, 187, 216, 0.18) 0%, transparent 65%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Jost', sans-serif;
      overflow: hidden;
    }

    /* ── main card ── */
    .card {
      position: relative;
      text-align: center;
      padding: 3rem 2rem;
      max-width: 680px;
      width: 100%;
    }

    /* ── logo ── */
    .logo {
      display: block;
      margin: 0 auto 1.2rem;
      width: clamp(180px, 42vw, 280px);
      height: auto;
      mix-blend-mode: multiply;
      /* ensure the JPEG white blends away on all browsers */
      -webkit-mix-blend-mode: multiply;
    }

    /* ── author name ── */
    .name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(3.2rem, 9vw, 6.5rem);
      color: var(--text-dark);
      line-height: 1;
      letter-spacing: 0.015em;
    }

    /* ── ornamental rule ── */
    .rule {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
      margin: 1.8rem auto;
    }

    .rule-line {
      width: 64px;
      height: 1px;
      background: var(--pink-accent);
      opacity: 0.7;
    }

    .rule-dot {
      width: 5px;
      height: 5px;
      background: var(--blue-accent);
      border-radius: 50%;
    }

    /* ── label ── */
    .label {
      font-family: 'Jost', sans-serif;
      font-weight: 200;
      font-size: 0.7rem;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--text-mid);
    }

    /* ── tagline ── */
    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      color: var(--text-mid);
      margin-top: 1.6rem;
      letter-spacing: 0.015em;
      line-height: 1.6;
    }

    /* ── footer ── */
    .footer {
      position: fixed;
      bottom: 1.6rem;
      left: 0;
      right: 0;
      text-align: center;
      font-family: 'Jost', sans-serif;
      font-weight: 200;
      font-size: 0.62rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--pink-accent);
      opacity: 0.65;
    }

    /* ── animations ── */
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo    { animation: riseIn 1.4s cubic-bezier(0.22,1,0.36,1) 0.1s both; }
    .name    { animation: riseIn 1.4s cubic-bezier(0.22,1,0.36,1) 0.25s both; }
    .rule    { animation: riseIn 1.2s cubic-bezier(0.22,1,0.36,1) 0.45s both; }
    .label   { animation: riseIn 1.2s cubic-bezier(0.22,1,0.36,1) 0.55s both; }
    .tagline { animation: riseIn 1.2s cubic-bezier(0.22,1,0.36,1) 0.70s both; }
    .footer  { animation: riseIn 1.0s cubic-bezier(0.22,1,0.36,1) 1.0s both; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }

    @media (max-width: 420px) {
      .name { font-size: 2.8rem; }
      .rule-line { width: 40px; }
    }
  </style>
</head>
<body>

  <main class="card">

    <!-- logo -->
    <img class="logo" src="logo.jpeg" alt="Margo Linjamaa">

    <!-- author name -->
    <h1 class="name">Margo Linjamaa</h1>

    <!-- ornamental rule -->
    <div class="rule" aria-hidden="true">
      <div class="rule-line"></div>
      <div class="rule-dot"></div>
      <div class="rule-line"></div>
    </div>

    <!-- label -->
    <p class="label"></p>

    <!-- tagline -->
    <p class="tagline">Coming soon</p>

  </main>

  <footer class="footer" aria-hidden="true">
    &copy; 2026
  </footer>

</body>
</html>
